<style>
  :root{
    --bg:#EDF0F1; --surface:#FFFFFF; --ink:#1C2427; --muted:#6B7580;
    --line:#DCE1E4; --today:#FFF8E6;
    --c-bloc:#3F7D4E; --c-cs:#B4557F; --c-visite:#7A5CA8; --c-perm:#B8762A;
    --c-garde:#A83232; --c-off:#7A848D; --c-fmc:#2F6F8F; --c-staff:#4A5B8C;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overscroll-behavior-y:none}
  body{
    background:var(--bg); color:var(--ink);
    font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top);
  }
  .app{max-width:600px;margin:0 auto;padding:0 14px 96px}

  /* ---------- barre de semaine ---------- */
  .nav{
    display:flex;align-items:center;gap:8px;
    padding:14px 2px 10px;position:sticky;top:0;z-index:5;
    background:linear-gradient(to bottom,var(--bg) 78%,transparent);
  }
  .nav h1{flex:1;margin:0;font-size:1.06rem;font-weight:640;letter-spacing:-.015em}
  .nav h1 small{display:block;font-size:.78rem;font-weight:400;color:var(--muted);letter-spacing:0}
  .arrow{
    flex:0 0 38px;height:38px;border-radius:19px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-size:1.05rem;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .arrow:disabled{opacity:.35;cursor:default}

  /* ---------- journées ---------- */
  .day{background:var(--surface);border-radius:12px;padding:11px 13px;margin:0 0 7px}
  .day.now{background:var(--today);box-shadow:inset 0 0 0 1.5px #E9C877}
  .day.vide{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
  .dh{display:flex;align-items:baseline;gap:7px;margin:0 0 7px}
  .dh .j{font-size:.95rem;font-weight:600;text-transform:capitalize}
  .dh .n{font-size:.8rem;color:var(--muted)}
  .day.vide .dh{margin:0}
  .day.vide .j{font-weight:400;color:var(--muted)}

  .ev{display:flex;gap:9px;align-items:flex-start;padding:4px 0 4px 9px;border-left:3px solid var(--c-off)}
  .ev time{flex:0 0 84px;font-size:.83rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
  .ev .t{font-size:.93rem}
  .ev .m{color:var(--muted);font-size:.81rem}
  .bloc{border-color:var(--c-bloc)}   .cs{border-color:var(--c-cs)}
  .visite{border-color:var(--c-visite)} .perm{border-color:var(--c-perm)}
  .garde{border-color:var(--c-garde)}  .off{border-color:var(--c-off)}
  .fmc{border-color:var(--c-fmc)}      .staff{border-color:var(--c-staff)}
  .garde .t{color:var(--c-garde);font-weight:560}

  /* ---------- écran d'import ---------- */
  .panel{background:var(--surface);border-radius:12px;padding:16px;margin:0 0 14px}
  .panel h2{margin:0 0 6px;font-size:1rem;font-weight:620}
  .panel p{margin:0;color:var(--muted);font-size:.88rem}
  button.big{
    font:inherit;font-weight:560;color:#fff;background:var(--ink);border:0;
    border-radius:11px;padding:14px 18px;width:100%;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  button.big.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
  button:focus-visible,.arrow:focus-visible{outline:2px solid var(--c-fmc);outline-offset:2px}
  input[type=file]{display:none}
  .stat{display:flex;gap:22px}
  .stat b{display:block;font-size:1.45rem;font-weight:640;letter-spacing:-.02em}
  .stat span{font-size:.8rem;color:var(--muted)}
  ul.help{margin:10px 0 0;padding:0 0 0 17px;color:var(--muted);font-size:.85rem;line-height:1.6}
  .err{background:#FBE9E9;color:#7B2020;border-radius:11px;padding:14px;font-size:.89rem;margin:0 0 14px}
  .empty{text-align:center;padding:44px 20px;color:var(--muted)}
  .empty p{margin:0 0 18px;font-size:.93rem}

  /* ---------- onglets ---------- */
  .tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    display:flex;background:rgba(255,255,255,.94);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabs button{
    flex:1;border:0;background:none;font:inherit;font-size:.8rem;color:var(--muted);
    padding:11px 0 9px;cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .tabs button[aria-selected="true"]{color:var(--ink);font-weight:600}
  .tabs button b{display:block;font-size:1.1rem;font-weight:400;line-height:1.2}
  [hidden]{display:none !important}
</style>

<script>
"use strict";

/* ================================================================== */
/* RÉGLAGES — tous les horaires et règles sont ici                     */
/* ================================================================== */
const INITIALES = "ED";

const H = {
  permanence:   ["08:00","18:00"],
  visite:       ["08:00","10:00"],
  blocJournee:  ["08:30","15:45"],
  blocMatin:    ["08:30","12:15"],
  blocAprem:    ["12:15","15:45"],
  blocRobot:    ["08:30","16:30"],
  orthoTot:     ["08:30","10:00"],
  orthoTard:    ["10:00","12:00"],
  csMatin:      ["08:40","12:20"],
  csAprem:      ["14:00","17:00"],
  repos:        ["08:00","17:00"],
  staff:        ["16:30","18:00"],
  sableCsMatin: ["09:40","12:00"],
  sableUrg1:    ["12:00","12:20"],
  sableUrg2:    ["13:40","14:00"],
  sableCsAprem: ["14:00","17:00"],
  sableBloc:    ["13:30","17:00"]
};

const STAFFS = { 4:"Staff programmation chirurgicale", 5:"Réunion de service" }; // 4 = jeudi, 5 = vendredi
const SALLES = /^(S\s*\d+|ECHO\s*\d+)$/i;
const AUTRES = {
  "GRE":"Grossesses à risque", "OBSTÉTRIQUE":"Obstétrique", "OBSTETRIQUE":"Obstétrique",
  "DAN":"Diagnostic anténatal", "HORS BLOC":"Chirurgie hors bloc",
  "COURRIERRCP":"RCP", "ADMINISTRATIF":"Administratif"
};

/* ================================================================== */
/* Utilitaires                                                         */
/* ================================================================== */
const norm = v => (v === null || v === undefined) ? "" : String(v).replace(/\s+/g," ").trim();

function mentionne(v){
  const s = norm(v);
  return s ? s.split(/[^A-Za-zÀ-ÿ0-9]+/).some(t => t.toUpperCase() === INITIALES) : false;
}
function docteurJunior(v){
  const m = norm(v).match(/DJ\s+([A-Z]{1,3})/i);
  return m ? m[1].toUpperCase() : null;
}
function toDate(v){
  if(v instanceof Date) return new Date(v.getFullYear(), v.getMonth(), v.getDate());
  if(typeof v === "number"){
    const d = new Date(Date.UTC(1899,11,30 + Math.floor(v)));
    return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  }
  return null;
}
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const MOIS  = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const minuit = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ================================================================== */
/* Lecture du classeur                                                 */
/* ================================================================== */
function lireFeuille(ws, num){
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null, blankrows:true});
  const lab = i => norm(rows[i] && rows[i][0]).toUpperCase();

  let iGarde = -1, iStatut = -1; const iBloc = [];
  for(let i=0;i<rows.length;i++){
    const L = lab(i);
    if(L === "GARDE" && iGarde < 0) iGarde = i;
    if(L === "BLOC") iBloc.push(i);
    if(L === INITIALES && iGarde >= 0 && iStatut < 0) iStatut = i;
  }
  if(iGarde < 0 || iBloc.length < 2) throw new Error("Structure inattendue dans « Semaine " + num + " ».");

  const debutAprem = iBloc[1];
  const dates = [];
  for(let c=1;c<=7;c++) dates.push(toDate(rows[1] && rows[1][c]));

  const collecte = (from,to) => {
    const parJour = [[],[],[],[],[],[],[]];
    let dernier = "";
    for(let i=from;i<to;i++){
      if(!rows[i]) continue;
      const brut = norm(rows[i][0]);
      if(brut) dernier = brut;
      for(let c=1;c<=7;c++) if(mentionne(rows[i][c])) parJour[c-1].push({label:dernier, valeur:norm(rows[i][c])});
    }
    return parJour;
  };

  const gardes = [], statuts = [];
  for(let c=1;c<=7;c++){
    gardes.push(mentionne(rows[iGarde] && rows[iGarde][c]));
    statuts.push(iStatut >= 0 ? norm(rows[iStatut] && rows[iStatut][c]) : "");
  }
  return {num, dates, matin:collecte(2,debutAprem), aprem:collecte(debutAprem,iGarde), gardes, statuts};
}

/* ================================================================== */
/* Construction d'une journée                                          */
/* ================================================================== */
function construireJour(date, matin, aprem, garde, statut, paire){
  const ev = [];
  const push = (titre,h,cls,note) => ev.push({titre, debut:h?h[0]:null, fin:h?h[1]:null, cls, note:note||null});
  const S = statut.toUpperCase();
  const jour = date.getDay();

  if(garde) push("Garde", null, "garde", "18h → 8h le lendemain");

  const staff = () => { if(STAFFS[jour]) push(STAFFS[jour], H.staff, "staff"); };

  if(S === "CA"){ push("Congés", null, "off"); return ev; }
  if(S === "AT"){ push("Arrêt de travail", null, "off"); return ev; }
  if(S === "FMC"){ push("FMC", null, "fmc"); return ev; }
  if(S === "RS" || S === "RSN"){ push("Repos de sécurité", H.repos, "off"); return ev; }
  if(S === "0.9" || statut === "0,9"){ push("Non travaillé (90 %)", null, "off"); return ev; }
  if(S === "ROBOT"){ push("Bloc robot", H.blocRobot, "bloc"); staff(); return ev; }

  if(/BAILLEUL|PSSL|SABL/i.test(statut)){
    push("Consultations", H.sableCsMatin, "cs", "Le Bailleul");
    push("Urgences", H.sableUrg1, "cs", "Le Bailleul");
    if(paire) push("Bloc opératoire", H.sableBloc, "bloc", "Le Bailleul");
    else { push("Urgences", H.sableUrg2, "cs", "Le Bailleul");
           push("Consultations", H.sableCsAprem, "cs", "Le Bailleul"); }
    return ev;
  }

  const a = re => matin.some(x => re.test(x.label));
  const b = re => aprem.some(x => re.test(x.label));

  const perm = matin.find(x => /^PERMANENCE$/i.test(x.label));
  if(perm){
    const dj = docteurJunior(perm.valeur);
    push("Permanence", H.permanence, "perm", dj ? "supervision DJ " + dj : null);
  }

  const visite = a(/^GYNECO$/i);
  if(visite) push("Visite gynéco", H.visite, "visite");

  const bM = a(/^BLOC$/i), bA = b(/^BLOC$/i);
  if(bM && bA) push("Bloc opératoire", H.blocJournee, "bloc");
  else if(bM)  push("Bloc opératoire", H.blocMatin, "bloc");
  else if(bA)  push("Bloc opératoire", H.blocAprem, "bloc");

  if(a(/ORTHO BLOC/i))     push("Bloc orthogénie", visite ? H.orthoTard : H.orthoTot, "bloc");
  if(b(/^ORTHOGENIE$/i))   push("Consultation orthogénie", H.csAprem, "cs");

  const salles = (liste, h) => liste.forEach(x => {
    if(SALLES.test(x.label)) push("Consultations", h, "cs", x.label.replace(/\s+/g," "));
    else { const n = AUTRES[x.label.toUpperCase()]; if(n) push(n, h, "cs"); }
  });
  salles(matin, H.csMatin);
  salles(aprem, H.csAprem);

  matin.concat(aprem).forEach(x => {
    if(/[<>]/.test(x.valeur)) push("À vérifier : " + x.valeur, null, "off", x.label);
  });

  if(ev.length) staff();
  return ev;
}

/* ================================================================== */
/* État et mémoire                                                     */
/* ================================================================== */
const CLE = "planning-ed-v2";
let PLANNING = [];   // [{date:Date, semaine, evenements:[]}]
let curseur = 0;     // index de la semaine affichée
let SEMAINES = [];   // [{num, jours:[...]}]

function sauver(){
  try{
    localStorage.setItem(CLE, JSON.stringify(PLANNING.map(j => ({...j, date: iso(j.date)}))));
  }catch(e){ /* mode privé ou stockage indisponible : on continue sans mémoire */ }
}
function charger(){
  try{
    const brut = localStorage.getItem(CLE);
    if(!brut) return false;
    PLANNING = JSON.parse(brut).map(j => ({...j, date: new Date(j.date + "T00:00:00")}));
    return PLANNING.length > 0;
  }catch(e){ return false; }
}

function grouper(){
  SEMAINES = [];
  PLANNING.forEach(j => {
    let s = SEMAINES[SEMAINES.length-1];
    if(!s || s.num !== j.semaine){ s = {num:j.semaine, jours:[]}; SEMAINES.push(s); }
    s.jours.push(j);
  });
  const auj = minuit(new Date());
  const i = SEMAINES.findIndex(s => s.jours.some(j => j.date >= auj));
  curseur = i < 0 ? Math.max(0, SEMAINES.length-1) : i;
}

/* ================================================================== */
/* Rendu — vue semaine                                                 */
/* ================================================================== */
function rendreSemaine(){
  const zone = document.getElementById("semaine");
  const titre = document.getElementById("titre");
  const sst = document.getElementById("sstitre");

  if(!SEMAINES.length){
    titre.childNodes[0].nodeValue = "Planning";
    sst.textContent = "Aucun semainier chargé";
    zone.innerHTML = '<div class="empty"><p>Charge le semainier de l\'équipe pour voir tes semaines.</p>' +
                     '<button class="big" onclick="document.getElementById(\'tab-i\').click()">Ouvrir le semainier</button></div>';
    document.getElementById("prev").disabled = true;
    document.getElementById("next").disabled = true;
    return;
  }

  const s = SEMAINES[curseur];
  const d1 = s.jours[0].date, d2 = s.jours[s.jours.length-1].date;
  titre.childNodes[0].nodeValue = "Semaine " + s.num;
  sst.textContent = d1.getDate() + " " + MOIS[d1.getMonth()] + " – " + d2.getDate() + " " + MOIS[d2.getMonth()];
  document.getElementById("prev").disabled = curseur === 0;
  document.getElementById("next").disabled = curseur === SEMAINES.length-1;

  const auj = iso(minuit(new Date()));
  const parDate = {}; s.jours.forEach(j => parDate[iso(j.date)] = j);

  // toute la semaine, y compris les jours sans rien
  let html = "";
  const debut = new Date(d1); debut.setDate(debut.getDate() - ((debut.getDay()+6)%7));
  for(let k=0;k<7;k++){
    const d = new Date(debut); d.setDate(debut.getDate()+k);
    const j = parDate[iso(d)];
    const now = iso(d) === auj ? " now" : "";
    if(!j){
      if(k >= 5) continue; // week-end vide : on n'encombre pas
      html += '<div class="day vide' + now + '"><div class="dh"><span class="j">' +
              JOURS[d.getDay()] + " " + d.getDate() + '</span></div></div>';
      continue;
    }
    html += '<div class="day' + now + '"><div class="dh"><span class="j">' +
            JOURS[d.getDay()] + " " + d.getDate() + '</span>' +
            '<span class="n">' + j.evenements.length + '</span></div>';
    j.evenements.forEach(e => {
      html += '<div class="ev ' + e.cls + '"><time>' +
              (e.debut ? e.debut.replace(":","h") + "–" + e.fin.replace(":","h") : "journée") +
              '</time><div><span class="t">' + esc(e.titre) + '</span>' +
              (e.note ? ' <span class="m">' + esc(e.note) + '</span>' : '') + '</div></div>';
    });
    html += '</div>';
  }
  zone.innerHTML = html;
}

/* ================================================================== */
/* Rendu — écran semainier                                             */
/* ================================================================== */
function rendreImport(msg){
  const z = document.getElementById("import-zone");
  let html = msg ? '<div class="err">' + esc(msg) + '</div>' : "";

  if(PLANNING.length){
    const total = PLANNING.reduce((n,j) => n + j.evenements.length, 0);
    html += '<div class="panel"><div class="stat">' +
            '<div><b>' + SEMAINES.length + '</b><span>semaines</span></div>' +
            '<div><b>' + PLANNING.length + '</b><span>journées</span></div>' +
            '<div><b>' + total + '</b><span>événements</span></div></div></div>';
    html += '<button class="big" id="gen">Générer le calendrier</button>' +
            '<ul class="help">' +
            '<li>Ouvre le fichier téléchargé depuis l\'app Fichiers, puis « Tout ajouter » dans le calendrier Pro.</li>' +
            '<li>Avant de réimporter, supprime le calendrier Pro et recrée-le pour éviter les doublons.</li></ul>' +
            '<div style="height:14px"></div>' +
            '<button class="big ghost" id="pick2">Charger un autre semainier</button>';
  }else{
    html += '<div class="panel"><h2>Aucun semainier chargé</h2>' +
            '<p>Le fichier de l\'équipe couvre six mois. Les semaines déjà passées sont ignorées.</p></div>' +
            '<button class="big" id="pick2">Choisir le semainier</button>';
  }
  z.innerHTML = html;

  const p = document.getElementById("pick2");
  if(p) p.addEventListener("click", () => document.getElementById("fichier").click());
  const g = document.getElementById("gen");
  if(g) g.addEventListener("click", telecharger);
}

/* ================================================================== */
/* Fichier calendrier                                                  */
/* ================================================================== */
function ics(){
  const ech = s => String(s).replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n");
  const stamp = new Date().toISOString().replace(/[-:]/g,"").split(".")[0] + "Z";
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Semainier//FR","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  PLANNING.forEach(j => {
    const d = iso(j.date).replace(/-/g,"");
    j.evenements.forEach((e,k) => {
      L.push("BEGIN:VEVENT", "UID:" + d + "-" + k + "-semainier@local", "DTSTAMP:" + stamp);
      if(e.debut){
        L.push("DTSTART:" + d + "T" + e.debut.replace(":","") + "00");
        L.push("DTEND:"   + d + "T" + e.fin.replace(":","")   + "00");
      }else{
        const f = new Date(j.date.getTime() + 86400000);
        L.push("DTSTART;VALUE=DATE:" + d, "DTEND;VALUE=DATE:" + iso(f).replace(/-/g,""));
      }
      L.push("SUMMARY:" + ech(e.titre));
      if(e.note) L.push("DESCRIPTION:" + ech(e.note));
      L.push("END:VEVENT");
    });
  });
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}

function telecharger(){
  const url = URL.createObjectURL(new Blob([ics()], {type:"text/calendar;charset=utf-8"}));
  const a = document.createElement("a");
  a.href = url; a.download = "planning-pro.ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ================================================================== */
/* Traitement du fichier                                               */
/* ================================================================== */
document.getElementById("fichier").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const fr = new FileReader();
  fr.onerror = () => rendreImport("Le fichier n'a pas pu être lu. Sélectionne-le depuis l'app Fichiers.");
  fr.onload = ev => {
    try{ traiter(new Uint8Array(ev.target.result)); }
    catch(err){ rendreImport(err.message); }
  };
  fr.readAsArrayBuffer(f);
  e.target.value = "";
});

function traiter(buf){
  const wb = XLSX.read(buf, {type:"array", cellDates:true});
  const auj = minuit(new Date());
  const res = [];
  wb.SheetNames.forEach(nom => {
    const m = nom.match(/^Semaine\s+(\d+)$/i);
    if(!m) return;
    const num = parseInt(m[1],10);
    const f = lireFeuille(wb.Sheets[nom], num);
    const fin = f.dates[6] || f.dates[4];
    if(!fin || fin < auj) return;
    const paire = num % 2 === 0;
    for(let i=0;i<7;i++){
      const d = f.dates[i];
      if(!d || d < auj) continue;
      const evs = construireJour(d, f.matin[i], f.aprem[i], f.gardes[i], f.statuts[i], paire);
      if(evs.length) res.push({date:d, semaine:num, evenements:evs});
    }
  });
  if(!res.length) throw new Error("Aucune vacation trouvée pour " + INITIALES + " à partir d'aujourd'hui. Vérifie que c'est le bon fichier.");
  PLANNING = res;
  grouper(); sauver();
  rendreImport(); rendreSemaine();
  document.getElementById("tab-s").click();
}

/* ================================================================== */
/* Navigation                                                          */
/* ================================================================== */
document.getElementById("prev").addEventListener("click", () => { if(curseur > 0){ curseur--; rendreSemaine(); window.scrollTo(0,0);} });
document.getElementById("next").addEventListener("click", () => { if(curseur < SEMAINES.length-1){ curseur++; rendreSemaine(); window.scrollTo(0,0);} });

function onglet(actif){
  const s = actif === "s";
  document.getElementById("vue-semaine").hidden = !s;
  document.getElementById("vue-import").hidden  = s;
  document.getElementById("tab-s").setAttribute("aria-selected", s);
  document.getElementById("tab-i").setAttribute("aria-selected", !s);
  window.scrollTo(0,0);
}
document.getElementById("tab-s").addEventListener("click", () => onglet("s"));
document.getElementById("tab-i").addEventListener("click", () => onglet("i"));

/* Démarrage */
if(charger()) grouper();
rendreSemaine();
rendreImport();
</script>
