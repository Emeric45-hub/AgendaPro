<style>
  :root{
    --bg:#EDF0F1; --surface:#FFFFFF; --ink:#1C2427; --muted:#6B7580;
    --line:#DCE1E4; --today:#FFF8E6;
    --c-bloc:#3F7D4E; --c-cs:#B4557F; --c-visite:#7A5CA8; --c-perm:#B8762A;
    --c-garde:#A83232; --c-off:#7A848D; --c-fmc:#2F6F8F; --c-staff:#4A5B8C;
    --c-perso:#9A6B2F;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overscroll-behavior-y:none}
  body{
    background:var(--bg); color:var(--ink);
    font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top);
  }
  .app{max-width:600px;margin:0 auto;padding:0 14px 96px}

  /* ---------- barre de semaine ---------- */
  .nav{
    display:flex;align-items:center;gap:8px;
    padding:14px 2px 10px;position:sticky;top:0;z-index:5;
    background:rgba(237,240,241,.96);
    -webkit-backdrop-filter:saturate(180%) blur(12px);backdrop-filter:saturate(180%) blur(12px);
    box-shadow:0 6px 10px -10px rgba(0,0,0,.35);
  }
  .nav h1{flex:1;margin:0;font-size:1.06rem;font-weight:640;letter-spacing:-.015em}
  .nav h1 small{display:block;font-size:.78rem;font-weight:400;color:var(--muted);letter-spacing:0}
  .arrow{
    flex:0 0 38px;height:38px;border-radius:19px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);font-size:1.05rem;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .arrow:disabled{opacity:.35;cursor:default}

  /* ---------- journées ---------- */
  #semaine{will-change:transform,opacity}
  @keyframes entreG{from{transform:translateX(-22px);opacity:0}to{transform:none;opacity:1}}
  @keyframes entreD{from{transform:translateX(22px);opacity:0}to{transform:none;opacity:1}}
  .glisseG{animation:entreG .28s cubic-bezier(.32,.72,0,1)}
  .glisseD{animation:entreD .28s cubic-bezier(.32,.72,0,1)}
  @media (prefers-reduced-motion:reduce){.glisseG,.glisseD{animation:none}}
  .day{background:var(--surface);border-radius:12px;padding:11px 13px;margin:0 0 7px}
  .day.now{background:var(--today);box-shadow:inset 0 0 0 1.5px #E9C877}
  .day.vide{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
  .dh{display:flex;align-items:baseline;gap:7px;margin:0 0 7px}
  .dh .j{font-size:.95rem;font-weight:600;text-transform:capitalize}
  .day.vide .dh{margin:0}
  .day.vide .j{font-weight:400;color:var(--muted)}

  .chip{
    display:flex;gap:9px;align-items:baseline;
    padding:7px 11px;border-radius:9px;margin:0 0 6px;
    background:var(--tint);border-left:4px solid var(--edge);
  }
  .chip .t{font-size:.92rem;font-weight:520}
  .chip .m{color:var(--muted);font-size:.81rem}

  .tl{position:relative;margin:2px 0 0 34px;border-left:1px solid var(--line)}
  .hh{position:absolute;left:0;right:0;border-top:1px dashed #E1E5E8;pointer-events:none}
  .hh span{
    position:absolute;left:-34px;top:-8px;width:30px;text-align:right;
    font-size:.7rem;color:#9AA3AA;font-variant-numeric:tabular-nums;
  }
  .blk{
    position:absolute;overflow:hidden;
    padding:4px 7px;border-radius:7px;
    background:var(--tint);border-left:3px solid var(--edge);
  }
  .blk .t{display:block;font-size:.84rem;font-weight:560;line-height:1.2}
  .blk .m{font-size:.76rem;color:var(--muted);font-weight:400}
  .blk .h{display:block;font-size:.71rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:1px}
  .blk.etroit .t{font-size:.78rem}
  .bloc  {--tint:#E2EFE6; --edge:var(--c-bloc)}
  .cs    {--tint:#F7E5EE; --edge:var(--c-cs)}
  .visite{--tint:#EAE3F6; --edge:var(--c-visite)}
  .perm  {--tint:#FAEBD6; --edge:var(--c-perm)}
  .garde {--tint:#F8DDDD; --edge:var(--c-garde)}
  .off   {--tint:#E6E9EB; --edge:var(--c-off)}
  .fmc   {--tint:#DEEAF2; --edge:var(--c-fmc)}
  .staff {--tint:#E2E7F4; --edge:var(--c-staff)}
  .garde .t{color:var(--c-garde)}

  /* ---------- retouches ---------- */
  .dh{justify-content:space-between}
  .dh .g{display:flex;align-items:baseline;gap:7px}
  .pt{font-size:.7rem;color:var(--c-perso);border:1px solid var(--c-perso);
      border-radius:5px;padding:0 4px;line-height:1.35}
  .men{
    border:0;background:none;color:var(--muted);font-size:1.1rem;line-height:1;
    padding:2px 4px;margin:-2px -4px;cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .blk,.chip{cursor:pointer}
  .perso{--tint:#EDE7DF; --edge:var(--c-perso)}
  .blk.chg::after,.chip.chg::after{
    content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;
    border-radius:3px;background:var(--c-perso);
  }
  .chip{position:relative}

  /* ---------- feuille d'édition ---------- */
  .fond{
    position:fixed;inset:0;z-index:40;background:rgba(20,26,29,.35);
    opacity:0;pointer-events:none;transition:opacity .22s ease;
  }
  .fond.on{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:41;
    background:var(--surface);border-radius:18px 18px 0 0;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(102%);transition:transform .3s cubic-bezier(.32,.72,0,1);
    max-height:88vh;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.14);
  }
  .sheet.on{transform:none}
  @media (prefers-reduced-motion:reduce){.sheet,.fond{transition:none}}
  .sheet h3{margin:0 0 14px;font-size:1.02rem;font-weight:620}
  .sheet label{display:block;font-size:.78rem;color:var(--muted);margin:0 0 4px}
  .sheet input[type=text],.sheet input[type=time]{
    width:100%;font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);
    border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin:0 0 12px;
    -webkit-appearance:none;appearance:none;
  }
  .sheet input[type=time]{min-height:42px}
  .duo{display:flex;gap:10px}.duo>div{flex:1}
  .types{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
  .types button{
    font:inherit;font-size:.82rem;font-weight:520;color:var(--ink);
    background:var(--tint);border:1.5px solid transparent;border-radius:8px;
    padding:7px 11px;cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .types button[aria-pressed="true"]{border-color:var(--edge)}
  .bascule{display:flex;align-items:center;gap:9px;margin:0 0 14px;font-size:.9rem}
  .bascule input{width:20px;height:20px;accent-color:var(--c-fmc)}
  .actions{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .actions button{
    font:inherit;font-weight:560;border-radius:11px;padding:13px;cursor:pointer;border:0;
    -webkit-tap-highlight-color:transparent;
  }
  .b1{background:var(--ink);color:#fff}
  .b2{background:var(--surface);color:var(--ink);border:1px solid var(--line) !important}
  .b3{background:#FBE9E9;color:#8C2525}
  .menu{display:flex;flex-direction:column;gap:2px;margin:-4px 0 0}
  .menu button{
    font:inherit;font-size:.95rem;text-align:left;background:none;border:0;color:var(--ink);
    padding:14px 4px;cursor:pointer;border-bottom:1px solid var(--line);
    -webkit-tap-highlight-color:transparent;
  }
  .menu button:last-child{border-bottom:0}
  .menu button.rouge{color:#8C2525}

  /* ---------- écran d'import ---------- */
  .panel{background:var(--surface);border-radius:12px;padding:16px;margin:0 0 14px}
  .panel h2{margin:0 0 6px;font-size:1rem;font-weight:620}
  .panel p{margin:0;color:var(--muted);font-size:.88rem}
  button.big{
    font:inherit;font-weight:560;color:#fff;background:var(--ink);border:0;
    border-radius:11px;padding:14px 18px;width:100%;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  button.big.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
  button:focus-visible,.arrow:focus-visible{outline:2px solid var(--c-fmc);outline-offset:2px}
  input[type=file]{display:none}
  .stat{display:flex;gap:22px}
  .stat b{display:block;font-size:1.45rem;font-weight:640;letter-spacing:-.02em}
  .stat span{font-size:.8rem;color:var(--muted)}
  ul.help{margin:10px 0 0;padding:0 0 0 17px;color:var(--muted);font-size:.85rem;line-height:1.6}
  .err{background:#FBE9E9;color:#7B2020;border-radius:11px;padding:14px;font-size:.89rem;margin:0 0 14px}
  .empty{text-align:center;padding:44px 20px;color:var(--muted)}
  .empty p{margin:0 0 18px;font-size:.93rem}

  /* ---------- onglets ---------- */
  .tabs{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    display:flex;background:rgba(255,255,255,.94);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabs button{
    flex:1;border:0;background:none;font:inherit;font-size:.8rem;color:var(--muted);
    padding:11px 0 9px;cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .tabs button[aria-selected="true"]{color:var(--ink);font-weight:600}
  .tabs button b{display:block;font-size:1.1rem;font-weight:400;line-height:1.2}
  [hidden]{display:none !important}
</style>

<div class="app">
  <section id="vue-semaine">
    <div class="nav">
      <button class="arrow" id="prev" aria-label="Semaine précédente">‹</button>

    </div>
    <div id="semaine"></div>

  <section id="vue-import" hidden>

  <button id="tab-s" aria-selected="true"><b>▤</b>Semaine</button>
  <button id="tab-i" aria-selected="false"><b>↓</b>Semainier</button>

<input type="file" id="fichier" accept=".xlsx,.xls">

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
  <h3 id="sh-t">Modifier</h3>
  <div id="sh-corps"></div>

<script>
"use strict";

/* ================================================================== */
/* RÉGLAGES — tous les horaires et règles sont ici                     */
/* ================================================================== */
const INITIALES = "ED";

const H = {
  permanence:   ["08:00","18:00"],
  visite:       ["08:00","10:00"],
  blocJournee:  ["08:30","15:45"],
  blocMatin:    ["08:30","12:15"],
  blocAprem:    ["12:15","15:45"],
  blocRobot:    ["08:30","16:30"],
  orthoTot:     ["08:30","10:00"],
  orthoTard:    ["10:00","12:00"],
  csMatin:      ["08:40","12:20"],
  csAprem:      ["14:00","17:00"],
  repos:        ["08:00","17:00"],
  staff:        ["16:30","18:00"],
  garde:        ["18:00","23:59"],
  sableCsMatin: ["09:40","12:00"],
  sableCsAprem: ["14:00","17:00"],
  sableBloc:    ["13:30","17:00"]
};

const STAFFS = { 4:"Staff programmation chirurgicale", 5:"Réunion de service" }; // 4 = jeudi, 5 = vendredi
const SALLES = /^(S\s*\d+|ECHO\s*\d+)$/i;

// Semaine « courte » : mercredi non travaillé (90 %) et bloc l'après-midi au Bailleul.
// Ancrage sur un lundi connu plutôt que sur la parité du numéro de semaine,
// qui s'inverse au passage d'une année (S53 puis S1 : deux numéros impairs de suite).
const ANCRE = Date.UTC(2027, 0, 4);        // lundi 04/01/2027, semaine à mercredi non travaillé
function semaineCourte(d){
  const l = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay()+6) % 7));
  return Math.round((l - ANCRE) / 604800000) % 2 === 0;
}
const AUTRES = {
  "GRE":"Grossesses à risque", "OBSTÉTRIQUE":"Obstétrique", "OBSTETRIQUE":"Obstétrique",
  "DAN":"Diagnostic anténatal", "HORS BLOC":"Chirurgie hors bloc",
  "COURRIERRCP":"RCP", "ADMINISTRATIF":"Administratif"
};

/* ================================================================== */
/* Utilitaires                                                         */
/* ================================================================== */
const norm = v => (v === null || v === undefined) ? "" : String(v).replace(/\s+/g," ").trim();

function mentionne(v){
  const s = norm(v);
  return s ? s.split(/[^A-Za-zÀ-ÿ0-9]+/).some(t => t.toUpperCase() === INITIALES) : false;
}
function docteurJunior(v){
  const m = norm(v).match(/DJ\s+([A-Z]{1,3})/i);
  return m ? m[1].toUpperCase() : null;
}
function toDate(v){
  if(v instanceof Date) return new Date(v.getUTCFullYear(), v.getUTCMonth(), v.getUTCDate());
  if(typeof v === "number"){
    const d = new Date(Date.UTC(1899,11,30 + Math.floor(v)));
    return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  }
  return null;
}
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const MOIS  = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const minuit = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ================================================================== */
/* Lecture du classeur                                                 */
/* ================================================================== */
function lireFeuille(ws, num){
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null, blankrows:true});
  const lab = i => norm(rows[i] && rows[i][0]).toUpperCase();

  let iGarde = -1, iStatut = -1; const iBloc = [];
  for(let i=0;i<rows.length;i++){
    const L = lab(i);
    if(L === "GARDE" && iGarde < 0) iGarde = i;
    if(L === "BLOC") iBloc.push(i);
    if(L === INITIALES && iGarde >= 0 && iStatut < 0) iStatut = i;
  }
  if(iGarde < 0 || iBloc.length < 2) throw new Error("Structure inattendue dans « Semaine " + num + " ».");

  const debutAprem = iBloc[1];
  const dates = [];
  for(let c=1;c<=7;c++) dates.push(toDate(rows[1] && rows[1][c]));

  const collecte = (from,to) => {
    const parJour = [[],[],[],[],[],[],[]];
    let dernier = "";
    for(let i=from;i<to;i++){
      if(!rows[i]) continue;
      const brut = norm(rows[i][0]);
      if(brut) dernier = brut;
      for(let c=1;c<=7;c++) if(mentionne(rows[i][c])) parJour[c-1].push({label:dernier, valeur:norm(rows[i][c])});
    }
    return parJour;
  };

  const gardes = [], statuts = [];
  for(let c=1;c<=7;c++){
    gardes.push(mentionne(rows[iGarde] && rows[iGarde][c]));
    statuts.push(iStatut >= 0 ? norm(rows[iStatut] && rows[iStatut][c]) : "");
  }
  return {num, dates, matin:collecte(2,debutAprem), aprem:collecte(debutAprem,iGarde), gardes, statuts};
}

/* ================================================================== */
/* Construction d'une journée                                          */
/* ================================================================== */
function construireJour(date, matin, aprem, garde, statut){
  const courte = semaineCourte(date);
  const ev = [];
  const push = (titre,h,cls,note) => ev.push({titre, debut:h?h[0]:null, fin:h?h[1]:null, cls, note:note||null});
  const S = statut.toUpperCase();
  const jour = date.getDay();

  if(garde) push("Garde", H.garde, "garde");

  const staff = () => { if(STAFFS[jour]) push(STAFFS[jour], H.staff, "staff"); };

  if(S === "CA"){ push("Congés", null, "off"); return ev; }
  if(S === "CN"){ push("Congé de naissance", null, "off"); return ev; }
  if(S === "AT"){ push("Arrêt de travail", null, "off"); return ev; }
  if(S === "FMC"){ push("FMC", null, "fmc"); return ev; }
  if(S === "RS" || S === "RSN"){ push("Repos de sécurité", H.repos, "off"); return ev; }
  if(S === "0.9" || statut === "0,9"){ push("Non travaillé (90 %)", null, "off"); return ev; }
  if(S === "ROBOT"){ push("Bloc robot", H.blocRobot, "bloc"); staff(); return ev; }

  if(/BAILLEUL|PSSL|SABL/i.test(statut)){
    push("Consultations", H.sableCsMatin, "cs", "Le Bailleul");
    if(courte) push("Bloc opératoire", H.sableBloc, "bloc", "Le Bailleul");
    else      push("Consultations", H.sableCsAprem, "cs", "Le Bailleul");
    return ev;
  }

  const a = re => matin.some(x => re.test(x.label));
  const b = re => aprem.some(x => re.test(x.label));

  const perm = matin.find(x => /^PERMANENCE$/i.test(x.label));
  if(perm){
    const dj = docteurJunior(perm.valeur);
    push("Permanence", H.permanence, "perm", dj ? "supervision DJ " + dj : null);
  }

  const visite = a(/^GYNECO$/i);
  if(visite) push("Visite gynéco", H.visite, "visite");

  const bM = a(/^BLOC$/i), bA = b(/^BLOC$/i);
  if(bM && bA) push("Bloc opératoire", H.blocJournee, "bloc");
  else if(bM)  push("Bloc opératoire", H.blocMatin, "bloc");
  else if(bA)  push("Bloc opératoire", H.blocAprem, "bloc");

  if(a(/ORTHO BLOC/i))     push("Bloc orthogénie", visite ? H.orthoTard : H.orthoTot, "bloc");
  if(b(/^ORTHOGENIE$/i))   push("Consultation orthogénie", H.csAprem, "cs");

  const salles = (liste, h) => liste.forEach(x => {
    if(SALLES.test(x.label)) push("Consultations", h, "cs", x.label.replace(/\s+/g," "));
    else { const n = AUTRES[x.label.toUpperCase()]; if(n) push(n, h, "cs"); }
  });
  if(!perm){                       // de permanence : la journée est couverte 8h-18h
    salles(matin, H.csMatin);
    salles(aprem, H.csAprem);
  }

  matin.concat(aprem).forEach(x => {
    if(/[<>]/.test(x.valeur)) push("À vérifier : " + x.valeur, null, "off", x.label);
  });

  if(ev.some(e => e.cls !== "garde")) staff();
  return ev;
}

/* ================================================================== */
/* État et mémoire                                                     */
/* ================================================================== */
const CLE = "planning-ed-v9";
const CLE_RET = "planning-ed-retouches";   // volontairement sans numéro de version :
                                           // les retouches survivent aux rechargements du semainier
let RET = {};   // { "2027-02-18": { mod:{sig:{...}}, sup:[sig], add:[{...}] } }

const TYPES = [["bloc","Bloc"],["cs","Consultation"],["visite","Visite"],["perm","Permanence"],
               ["garde","Garde"],["staff","Staff"],["fmc","Formation"],["off","Absence"],
               ["perso","Perso"]];

function chargerRet(){
  try{ RET = JSON.parse(localStorage.getItem(CLE_RET) || "{}") || {}; }catch(e){ RET = {}; }
}
function sauverRet(){
  try{ localStorage.setItem(CLE_RET, JSON.stringify(RET)); }catch(e){}
}
function retDu(di){
  if(!RET[di]) RET[di] = {mod:{}, sup:[], add:[]};
  const r = RET[di];
  r.mod = r.mod || {}; r.sup = r.sup || []; r.add = r.add || [];
  return r;
}
function nettoyer(di){
  const r = RET[di];
  if(r && !Object.keys(r.mod).length && !r.sup.length && !r.add.length) delete RET[di];
}
const retouche = di => !!RET[di];
const sigEv = e => e.titre + "|" + (e.debut || "") + "|" + (e.note || "");

// Événements d'une journée, retouches appliquées. Seul point de vérité pour l'écran et l'export.
function evJour(di, base){
  const r = RET[di] || {};
  const sup = r.sup || [], mod = r.mod || {}, add = r.add || [];
  const out = [];
  (base || []).forEach(e => {
    const sg = sigEv(e);
    if(sup.indexOf(sg) >= 0) return;
    out.push(mod[sg] ? Object.assign({}, e, mod[sg], {ref:sg, chg:true})
                     : Object.assign({}, e, {ref:sg}));
  });
  add.forEach(a => out.push(Object.assign({}, a, {ref:"+" + a.id, chg:true})));
  out.sort((a,b) => (a.debut||"").localeCompare(b.debut||""));
  return out;
}
function baseDu(di){
  const j = PLANNING.find(x => iso(x.date) === di);
  return j ? j.evenements : [];
}
let PLANNING = [];   // [{date:Date, semaine, evenements:[]}]
let curseur = 0;     // index de la semaine affichée
let SEMAINES = [];   // [{num, jours:[...]}]

function sauver(){
  try{
    localStorage.setItem(CLE, JSON.stringify(PLANNING.map(j => ({...j, date: iso(j.date)}))));
  }catch(e){ /* mode privé ou stockage indisponible : on continue sans mémoire */ }
}
function charger(){
  try{
    const brut = localStorage.getItem(CLE);
    if(!brut) return false;
    PLANNING = JSON.parse(brut).map(j => ({...j, date: new Date(j.date + "T00:00:00")}));
    return PLANNING.length > 0;
  }catch(e){ return false; }
}

function grouper(){
  SEMAINES = [];
  PLANNING.sort((a,b) => a.date - b.date);
  PLANNING.forEach(j => {
    const d = j.date;
    const l = iso(new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay()+6)%7)));
    let s = SEMAINES[SEMAINES.length-1];
    if(!s || s.lundi !== l){ s = {lundi:l, num:j.semaine, jours:[]}; SEMAINES.push(s); }
    s.jours.push(j);
  });
  const auj = minuit(new Date());
  const i = SEMAINES.findIndex(s => s.jours.some(j => j.date >= auj));
  curseur = i < 0 ? Math.max(0, SEMAINES.length-1) : i;
}

/* ================================================================== */
/* Rendu — vue semaine                                                 */
/* ================================================================== */
const PXH = 42;                       // pixels par heure
const mn = h => (+h.slice(0,2))*60 + (+h.slice(3,5));

function frise(evs, di){
  const pleins = evs.filter(e => !e.debut);
  const cales  = evs.filter(e => e.debut).map(e => ({...e, s:mn(e.debut), e2:mn(e.fin)}))
                    .sort((a,b) => a.s - b.s || b.e2 - a.e2);

  let html = pleins.map(e =>
    '<div class="chip ' + e.cls + (e.chg ? ' chg' : '') + '" data-d="' + di + '" data-ref="' + esc(e.ref||'') +
    '"><span class="t">' + esc(e.titre) + '</span>' +
    (e.note ? '<span class="m">' + esc(e.note) + '</span>' : '') + '</div>').join("");

  if(!cales.length) return html;

  // colonnes : on prend la première libre au moment où l'événement démarre
  const fins = [];
  cales.forEach(e => {
    let c = fins.findIndex(f => f <= e.s);
    if(c < 0) c = fins.length;
    fins[c] = e.e2; e.col = c;
  });
  const nb = Math.max(1, fins.length);

  const h0 = Math.floor(Math.min(...cales.map(e => e.s)) / 60);
  const h1 = Math.ceil(Math.max(...cales.map(e => e.e2)) / 60);
  const y  = m => (m - h0*60) / 60 * PXH;

  html += '<div class="tl" style="height:' + ((h1-h0)*PXH) + 'px">';
  for(let h = h0; h <= h1; h++)
    html += '<div class="hh" style="top:' + ((h-h0)*PXH) + 'px"><span>' + pad(h) + 'h</span></div>';

  cales.forEach(e => {
    const t = y(e.s), ht = Math.max(20, y(e.e2) - t - 2);
    const l = e.col * 100 / nb, w = 100 / nb;
    html += '<div class="blk ' + e.cls + (nb > 1 ? ' etroit' : '') + (e.chg ? ' chg' : '') +
            '" data-d="' + di + '" data-ref="' + esc(e.ref||'') + '" style="top:' + t +
            'px;height:' + ht + 'px;left:calc(' + l + '% + 4px);width:calc(' + w + '% - 8px)">' +
            '<span class="t">' + esc(e.titre) +
            (e.note ? ' <span class="m">' + esc(e.note) + '</span>' : '') + '</span>' +
            (ht >= 40 ? '<span class="h">' + e.debut.replace(":","h") + '–' + e.fin.replace(":","h") + '</span>' : '') +
            '</div>';
  });
  return html + '</div>';
}

function rendreSemaine(sens){
  const zone = document.getElementById("semaine");
  zone.classList.remove("glisseG","glisseD");
  if(sens){ void zone.offsetWidth; zone.classList.add(sens > 0 ? "glisseD" : "glisseG"); }
  const titre = document.getElementById("titre");
  const sst = document.getElementById("sstitre");

  if(!SEMAINES.length){
    titre.childNodes[0].nodeValue = "Planning";
    sst.textContent = "Aucun semainier chargé";
    zone.innerHTML = '<div class="empty"><p>Charge le semainier de l\'équipe pour voir tes semaines.</p>' +
                     '<button class="big" onclick="document.getElementById(\'tab-i\').click()">Ouvrir le semainier</button></div>';
    document.getElementById("prev").disabled = true;
    document.getElementById("next").disabled = true;
    return;
  }

  const s = SEMAINES[curseur];
  const d1 = s.jours[0].date;
  const debut = new Date(d1); debut.setDate(debut.getDate() - ((debut.getDay()+6)%7)); // lundi
  const dim = new Date(debut); dim.setDate(debut.getDate()+6);
  titre.childNodes[0].nodeValue = "Semaine " + s.num;
  sst.textContent = debut.getDate() + " " + MOIS[debut.getMonth()] + " – " + dim.getDate() + " " + MOIS[dim.getMonth()];
  document.getElementById("prev").disabled = curseur === 0;
  document.getElementById("next").disabled = curseur === SEMAINES.length-1;

  const auj = iso(minuit(new Date()));
  const parDate = {}; s.jours.forEach(j => parDate[iso(j.date)] = j);

  // toute la semaine, y compris les jours sans rien
  let html = "";
  for(let k=0;k<7;k++){
    const d = new Date(debut); d.setDate(debut.getDate()+k);
    const di = iso(d), now = di === auj ? " now" : "";
    const evs = evJour(di, parDate[di] ? parDate[di].evenements : []);
    const tete = '<div class="dh"><span class="g"><span class="j">' +
                 JOURS[d.getDay()] + " " + d.getDate() + '</span>' +
                 (retouche(di) ? '<span class="pt">retouché</span>' : '') +
                 '</span><button class="men" data-menu="' + di + '" aria-label="Modifier cette journée">⋯</button></div>';
    if(!evs.length){
      if(k >= 5 || di < auj) continue;  // week-end vide ou jour passé : on n'encombre pas
      html += '<div class="day vide' + now + '">' + tete + '</div>';
      continue;
    }
    html += '<div class="day' + now + '">' + tete + frise(evs, di) + '</div>';
  }
  zone.innerHTML = html;
}

/* ================================================================== */
/* Rendu — écran semainier                                             */
/* ================================================================== */
function rendreImport(msg){
  const z = document.getElementById("import-zone");
  let html = msg ? '<div class="err">' + esc(msg) + '</div>' : "";

  if(PLANNING.length){
    const dts = datesExport();
    const total = dts.reduce((n,di) => n + evJour(di, baseDu(di)).length, 0);
    const nRet = Object.keys(RET).length;
    html += '<div class="panel"><div class="stat">' +
            '<div><b>' + SEMAINES.length + '</b><span>semaines</span></div>' +
            '<div><b>' + PLANNING.length + '</b><span>journées</span></div>' +
            '<div><b>' + total + '</b><span>événements</span></div></div>' +
            (nRet ? '<p style="margin:10px 0 0">' + nRet + (nRet > 1 ? ' journées retouchées' : ' journée retouchée') +
                    ' à la main. Les retouches sont conservées quand tu recharges le semainier.</p>' : '') +
            '</div>';
    html += '<button class="big" id="gen">Générer le calendrier</button>' +
            '<ul class="help">' +
            '<li>Ouvre le fichier téléchargé depuis l\'app Fichiers, puis « Tout ajouter » dans le calendrier Pro.</li>' +
            '<li>Avant de réimporter, supprime le calendrier Pro et recrée-le pour éviter les doublons.</li></ul>' +
            '<div style="height:14px"></div>' +
            '<button class="big ghost" id="pick2">Ajouter un semainier</button>' +
            '<div style="height:8px"></div>' +
            '<button class="big ghost" id="vider">Tout effacer et repartir de zéro</button>';
  }else{
    html += '<div class="panel"><h2>Aucun semainier chargé</h2>' +
            '<p>Le fichier de l\'équipe couvre six mois. Les semaines déjà passées sont ignorées.</p></div>' +
            '<button class="big" id="pick2">Choisir le semainier</button>';
  }
  z.innerHTML = html;

  const p = document.getElementById("pick2");
  if(p) p.addEventListener("click", () => document.getElementById("fichier").click());
  const g = document.getElementById("gen");
  if(g) g.addEventListener("click", telecharger);
  const vd = document.getElementById("vider");
  if(vd) vd.addEventListener("click", () => {
    ouvrir("Tout effacer ?",
      '<p style="margin:0 0 14px;color:var(--muted);font-size:.9rem">Les semainiers chargés seront supprimés. ' +
      'Tes retouches manuelles sont conservées.</p><div class="actions">' +
      '<button class="b3" data-act="oui">Effacer les semainiers</button>' +
      '<button class="b2" data-act="non">Annuler</button></div>');
    document.getElementById("sh-corps").onclick = ev => {
      const b = ev.target.closest("button[data-act]"); if(!b) return;
      if(b.dataset.act === "oui"){
        PLANNING = []; SEMAINES = []; curseur = 0;
        try{ localStorage.removeItem(CLE); }catch(e){}
        rendreSemaine(); rendreImport();
      }
      fermer();
    };
  });
}

/* ================================================================== */
/* Fichier calendrier                                                  */
/* ================================================================== */
function datesExport(){
  const dates = PLANNING.map(j => iso(j.date));
  Object.keys(RET).forEach(di => { if(dates.indexOf(di) < 0) dates.push(di); });
  return dates.sort();
}

function ics(){
  const ech = s => String(s).replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n");
  const stamp = new Date().toISOString().replace(/[-:]/g,"").split(".")[0] + "Z";
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Semainier//FR","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  const dates = datesExport();
  dates.forEach(di => {
    const d = di.replace(/-/g,"");
    const jour = new Date(di + "T00:00:00");
    evJour(di, baseDu(di)).forEach((e,k) => {
      L.push("BEGIN:VEVENT", "UID:" + d + "-" + k + "-semainier@local", "DTSTAMP:" + stamp);
      if(e.debut){
        L.push("DTSTART:" + d + "T" + e.debut.replace(":","") + "00");
        L.push("DTEND:"   + d + "T" + e.fin.replace(":","")   + "00");
      }else{
        const f = new Date(jour.getTime() + 86400000);
        L.push("DTSTART;VALUE=DATE:" + d, "DTEND;VALUE=DATE:" + iso(f).replace(/-/g,""));
      }
      L.push("SUMMARY:" + ech(e.titre));
      if(e.note) L.push("DESCRIPTION:" + ech(e.note));
      L.push("END:VEVENT");
    });
  });
  L.push("END:VCALENDAR");
  return L.join("\r\n");
}

function telecharger(){
  const url = URL.createObjectURL(new Blob([ics()], {type:"text/calendar;charset=utf-8"}));
  const a = document.createElement("a");
  a.href = url; a.download = "planning-pro.ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ================================================================== */
/* Traitement du fichier                                               */
/* ================================================================== */
document.getElementById("fichier").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const fr = new FileReader();
  fr.onerror = () => rendreImport("Le fichier n'a pas pu être lu. Sélectionne-le depuis l'app Fichiers.");
  fr.onload = ev => {
    try{ traiter(new Uint8Array(ev.target.result)); }
    catch(err){ rendreImport(err.message); }
  };
  fr.readAsArrayBuffer(f);
  e.target.value = "";
});

function traiter(buf){
  const wb = XLSX.read(buf, {type:"array"});   // pas de cellDates : conversion maison, insensible au fuseau
  const auj = minuit(new Date());
  const res = [];
  wb.SheetNames.forEach(nom => {
    const m = nom.match(/^Semaine\s+(\d+)$/i);
    if(!m) return;
    const num = parseInt(m[1],10);
    const f = lireFeuille(wb.Sheets[nom], num);
    const fin = f.dates[6] || f.dates[4];
    if(!fin || fin < auj) return;
    for(let i=0;i<7;i++){
      const d = f.dates[i];
      if(!d || d < auj) continue;
      const evs = construireJour(d, f.matin[i], f.aprem[i], f.gardes[i], f.statuts[i]);
      if(evs.length){
        evs.sort((x,y) => (x.debut||"").localeCompare(y.debut||""));
        res.push({date:d, semaine:num, evenements:evs});
      }
    }
  });
  if(!res.length) throw new Error("Aucune vacation trouvée pour " + INITIALES + " à partir d'aujourd'hui. Vérifie que c'est le bon fichier.");
  // Un semainier couvre six mois ; le suivant prend le relais sans effacer la fin du précédent.
  const parDate = {};
  PLANNING.forEach(j => parDate[iso(j.date)] = j);
  res.forEach(j => parDate[iso(j.date)] = j);   // en cas de chevauchement, le fichier chargé fait foi
  PLANNING = Object.keys(parDate).sort().map(k => parDate[k]).filter(j => j.date >= auj);
  grouper(); sauver();
  rendreImport(); rendreSemaine();
  document.getElementById("tab-s").click();
}

/* ================================================================== */
/* Navigation                                                          */
/* ================================================================== */
document.getElementById("prev").addEventListener("click", () => { if(curseur > 0){ curseur--; rendreSemaine(-1); window.scrollTo(0,0);} });
document.getElementById("next").addEventListener("click", () => { if(curseur < SEMAINES.length-1){ curseur++; rendreSemaine(1); window.scrollTo(0,0);} });

let tx = 0, ty = 0;
const vue = document.getElementById("vue-semaine");
vue.addEventListener("touchstart", e => { tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY; }, {passive:true});
vue.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)*1.5) return;
  const b = document.getElementById(dx < 0 ? "next" : "prev");
  if(!b.disabled) b.click();
}, {passive:true});

/* ================================================================== */
/* Feuille d'édition                                                   */
/* ================================================================== */
const fond = document.getElementById("fond");
const sheet = document.getElementById("sheet");

function fermer(){ sheet.classList.remove("on"); fond.classList.remove("on"); }
function ouvrir(titre, corps){
  document.getElementById("sh-t").textContent = titre;
  document.getElementById("sh-corps").innerHTML = corps;
  fond.classList.add("on"); sheet.classList.add("on");
}
fond.addEventListener("click", fermer);

function rafraichir(){ sauverRet(); rendreSemaine(); rendreImport(); }

function menuJour(di){
  const d = new Date(di + "T00:00:00");
  ouvrir(JOURS[d.getDay()] + " " + d.getDate() + " " + MOIS[d.getMonth()],
    '<div class="menu">' +
    '<button data-act="add">Ajouter un créneau</button>' +
    (evJour(di, baseDu(di)).length ? '<button class="rouge" data-act="vider">Vider la journée</button>' : '') +
    (retouche(di) ? '<button data-act="reset">Rétablir le semainier</button>' : '') +
    '<button data-act="rien">Annuler</button></div>');
  document.getElementById("sh-corps").onclick = ev => {
    const b = ev.target.closest("button[data-act]"); if(!b) return;
    const a = b.dataset.act;
    if(a === "add"){ editer(di, null); return; }
    if(a === "vider"){
      const r = retDu(di);
      baseDu(di).forEach(e => { if(r.sup.indexOf(sigEv(e)) < 0) r.sup.push(sigEv(e)); });
      r.add = []; r.mod = {};
      fermer(); rafraichir(); return;
    }
    if(a === "reset"){ delete RET[di]; fermer(); rafraichir(); return; }
    fermer();
  };
}

function editer(di, ref){
  const e = ref ? evJour(di, baseDu(di)).find(x => x.ref === ref) : null;
  const nouveau = !e;
  const v = e || {titre:"", cls:"perso", debut:"14:00", fin:"17:00", note:""};
  const plein = !!e && !e.debut;
  const d = new Date(di + "T00:00:00");

  ouvrir((nouveau ? "Nouveau créneau — " : "") + JOURS[d.getDay()] + " " + d.getDate() + " " + MOIS[d.getMonth()],
    '<label for="f-t">Intitulé</label><input type="text" id="f-t" value="' + esc(v.titre) + '" placeholder="Ex. RDV médical Lou">' +
    '<label for="f-n">Précision (facultatif)</label><input type="text" id="f-n" value="' + esc(v.note || "") + '" placeholder="Ex. salle, confrère, lieu">' +
    '<label>Type</label><div class="types" id="f-c">' +
      TYPES.map(t => '<button type="button" class="' + t[0] + '" data-c="' + t[0] + '" aria-pressed="' +
                     (t[0] === v.cls) + '">' + t[1] + '</button>').join("") + '</div>' +
    '<label class="bascule"><input type="checkbox" id="f-j"' + (plein ? " checked" : "") + '> Journée entière</label>' +
    '<div class="duo" id="f-h"><div><label for="f-d">Début</label><input type="time" id="f-d" value="' + (v.debut || "08:00") + '"></div>' +
    '<div><label for="f-f">Fin</label><input type="time" id="f-f" value="' + (v.fin || "12:00") + '"></div></div>' +
    '<div class="actions">' +
    '<button class="b1" data-act="ok">Enregistrer</button>' +
    (!nouveau && e.chg && ref[0] !== "+" ? '<button class="b2" data-act="rest">Rétablir depuis le semainier</button>' : '') +
    (nouveau ? '' : '<button class="b3" data-act="sup">Supprimer ce créneau</button>') +
    '<button class="b2" data-act="non">Annuler</button></div>');

  let cls = v.cls;
  const bloc = document.getElementById("f-h"), coche = document.getElementById("f-j");
  const maj = () => bloc.style.display = coche.checked ? "none" : "flex";
  coche.onchange = maj; maj();
  document.getElementById("f-c").onclick = ev => {
    const b = ev.target.closest("button[data-c]"); if(!b) return;
    cls = b.dataset.c;
    [...document.querySelectorAll("#f-c button")].forEach(x => x.setAttribute("aria-pressed", x === b));
  };
  document.getElementById("sh-corps").onclick = ev => {
    const b = ev.target.closest("button[data-act]"); if(!b) return;
    const a = b.dataset.act, r = retDu(di);
    if(a === "non"){ nettoyer(di); fermer(); return; }
    if(a === "sup"){
      if(ref[0] === "+") r.add = r.add.filter(x => "+" + x.id !== ref);
      else { delete r.mod[ref]; if(r.sup.indexOf(ref) < 0) r.sup.push(ref); }
      nettoyer(di); fermer(); rafraichir(); return;
    }
    if(a === "rest"){ delete r.mod[ref]; nettoyer(di); fermer(); rafraichir(); return; }

    const t = document.getElementById("f-t").value.trim();
    if(!t){ document.getElementById("f-t").focus(); return; }
    const note = document.getElementById("f-n").value.trim();
    let deb = null, fin = null;
    if(!coche.checked){
      deb = document.getElementById("f-d").value || "08:00";
      fin = document.getElementById("f-f").value || "12:00";
      if(fin <= deb){ document.getElementById("f-f").focus(); return; }
    }
    const obj = {titre:t, note:note || null, cls:cls, debut:deb, fin:fin};
    if(nouveau) r.add.push(Object.assign({id:Date.now().toString(36)}, obj));
    else if(ref[0] === "+") r.add = r.add.map(x => "+" + x.id === ref ? Object.assign({}, x, obj) : x);
    else r.mod[ref] = obj;
    nettoyer(di); fermer(); rafraichir();
  };
}

document.getElementById("semaine").addEventListener("click", ev => {
  const m = ev.target.closest("button[data-menu]");
  if(m){ menuJour(m.dataset.menu); return; }
  const b = ev.target.closest(".blk,.chip");
  if(b && b.dataset.d) editer(b.dataset.d, b.dataset.ref);
});

function onglet(actif){
  const s = actif === "s";
  document.getElementById("vue-semaine").hidden = !s;
  document.getElementById("vue-import").hidden  = s;
  document.getElementById("tab-s").setAttribute("aria-selected", s);
  document.getElementById("tab-i").setAttribute("aria-selected", !s);
  window.scrollTo(0,0);
}
document.getElementById("tab-s").addEventListener("click", () => onglet("s"));
document.getElementById("tab-i").addEventListener("click", () => onglet("i"));

/* Démarrage */
chargerRet();
if(charger()) grouper();
rendreSemaine();
rendreImport();
</script>
